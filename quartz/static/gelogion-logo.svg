
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64">

  <!-- 1. 深藍綠背景 -->
  <rect
    x="2" y="2"
    width="60" height="60"
    rx="13"
    fill="#193c43"
  />

  <!-- 2. 白色方格外框 -->
  <rect
    x="13" y="13"
    width="38" height="38"
    rx="4"
    fill="none"
    stroke="#f5f3ea"
    stroke-width="3"
  />

  <!-- 3. 十字分割線 -->
  <path
    d="M32 13 V51 M13 32 H51"
    stroke="#f5f3ea"
    stroke-width="2.7"
  />

  <!-- 4. 右上角金色亮格 -->
  <rect
    x="35.5" y="16.5"
    width="12" height="12"
    rx="2"
    fill="#efbb69"
  />

  <!-- 5. 左下角白色圓點 -->
  <circle
    cx="22.5" cy="41.5"
    r="3.5"
    fill="#f5f3ea"
  />

</svg>
